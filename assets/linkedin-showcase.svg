<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="liBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <radialGradient id="liGlow" cx="90%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#EEF2FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="liCardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#liBg)"/>
  <rect width="1200" height="675" fill="url(#liGlow)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.12" stroke="#0284C7" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" stroke-dasharray="8,8"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke-dasharray="8,8"/>
    <line x1="0" y1="405" x2="1200" y2="405" stroke-dasharray="8,8"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke-dasharray="8,8"/>
    <line x1="300" y1="0" x2="300" y2="675" stroke-dasharray="8,8"/>
    <line x1="600" y1="0" x2="600" y2="675" stroke-dasharray="8,8"/>
    <line x1="900" y1="0" x2="900" y2="675" stroke-dasharray="8,8"/>
  </g>

  <!-- TOP HEADER -->
  <g transform="translate(60, 45)">
    <!-- Brand Pill -->
    <rect width="330" height="32" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="5" fill="#4F46E5"/>
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#4338CA" letter-spacing="0.8">DATHEON VIBE CODING CAPSTONE</text>

    <!-- Project Title with Proper Spacing -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-1">
      CreatorFlow AI <tspan fill="url(#liBrand)">— Full-Stack Micro-SaaS</tspan>
    </text>

    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#334155">The Autonomous Content Planning &amp; Campaign Orchestration Operating System</text>
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748B">Engineered following the TITAN &amp; FUSION architectural frameworks with Next.js 15, React 19, and Supabase RLS</text>
  </g>

  <!-- 4 SHOWCASE FEATURE CARDS -->
  <g transform="translate(60, 210)">
    <!-- Feature 1: Strategic Campaign Hub -->
    <g filter="url(#liCardShadow)">
      <rect width="255" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#EEF2FF"/>
      <text x="39" y="45" font-family="sans-serif" font-size="20" fill="#4F46E5" text-anchor="middle">🎯</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Strategic Campaign Hub</text>
      <text x="18" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#4F46E5">Audience Calibration</text>

      <text x="18" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569">
        <tspan x="18" dy="0">Define target personas,</tspan>
        <tspan x="18" dy="18">quarterly milestones, and</tspan>
        <tspan x="18" dy="18">goals before writing a word.</tspan>
      </text>

      <rect x="18" y="196" width="135" height="26" rx="6" fill="#F1F5F9"/>
      <text x="85" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">✓ Personas &amp; Goals</text>
    </g>

    <!-- Feature 2: Explainable AI Studio -->
    <g transform="translate(275, 0)" filter="url(#liCardShadow)">
      <rect width="255" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#F5F3FF"/>
      <text x="39" y="45" font-family="sans-serif" font-size="20" fill="#7C3AED" text-anchor="middle">⚡</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Explainable AI Studio</text>
      <text x="18" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7C3AED">Platform Copy &amp; Hooks</text>

      <text x="18" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569">
        <tspan x="18" dy="0">Synthesize multi-channel copy</tspan>
        <tspan x="18" dy="18">with transparent reasoning</tspan>
        <tspan x="18" dy="18">explaining audience fit.</tspan>
      </text>

      <rect x="18" y="196" width="135" height="26" rx="6" fill="#F3E8FF"/>
      <text x="85" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">✓ 98% Match Score</text>
    </g>

    <!-- Feature 3: Status Kanban Pipeline -->
    <g transform="translate(550, 0)" filter="url(#liCardShadow)">
      <rect width="255" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#FEF3C7"/>
      <text x="39" y="45" font-family="sans-serif" font-size="20" fill="#D97706" text-anchor="middle">📊</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Kanban Status Pipeline</text>
      <text x="18" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#D97706">Idea to Publication</text>

      <text x="18" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569">
        <tspan x="18" dy="0">Move content from Idea</tspan>
        <tspan x="18" dy="18">➔ Draft ➔ Review ➔</tspan>
        <tspan x="18" dy="18">Scheduled ➔ Published.</tspan>
      </text>

      <rect x="18" y="196" width="135" height="26" rx="6" fill="#FEF3C7"/>
      <text x="85" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">✓ 5 Status Columns</text>
    </g>

    <!-- Feature 4: PostgreSQL RLS Isolation -->
    <g transform="translate(825, 0)" filter="url(#liCardShadow)">
      <rect width="255" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="#ECFDF5"/>
      <text x="39" y="45" font-family="sans-serif" font-size="20" fill="#10B981" text-anchor="middle">🛡️</text>
      <text x="18" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#0F172A">PostgreSQL RLS Security</text>
      <text x="18" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#059669">Zero-Leakage Multi-Tenant</text>

      <text x="18" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#475569">
        <tspan x="18" dy="0">Strict database engine</tspan>
        <tspan x="18" dy="18">enforcement ensuring zero</tspan>
        <tspan x="18" dy="18">cross-tenant data leakage.</tspan>
      </text>

      <rect x="18" y="196" width="135" height="26" rx="6" fill="#DCFCE7"/>
      <text x="85" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">✓ auth.uid() Enforced</text>
    </g>
  </g>

  <!-- BOTTOM BAR: Tech Stack & Verification Badges -->
  <g transform="translate(60, 480)">
    <rect width="1080" height="135" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#liCardShadow)"/>

    <!-- Left: Tech Stack -->
    <g transform="translate(24, 20)">
      <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#64748B">PRODUCTION TECH STACK</text>

      <g transform="translate(0, 32)">
        <rect width="90" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="45" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Next.js 15</text>

        <rect x="98" width="90" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="143" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0284C7" text-anchor="middle">React 19</text>

        <rect x="196" width="115" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="253" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">TypeScript 5.7</text>

        <rect x="319" width="115" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="376" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">Supabase DB</text>

        <rect x="442" width="105" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="494" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0284C7" text-anchor="middle">Tailwind CSS</text>

        <rect x="555" width="125" height="26" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <text x="617" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">✓ Vitest 100% Pass</text>
      </g>

      <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Architecture: TITAN (Target, Interface, Technology, AI, Non-negotiable quality) &amp; FUSION Frameworks</text>
    </g>

    <!-- Right: GitHub Repo Callout -->
    <g transform="translate(740, 24)">
      <rect width="315" height="85" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#0F172A"/>
      <path d="M 28 17 C 22 17 17 22 17 28 C 17 33 20 37 25 38 C 25.5 38 25.7 37.8 25.7 37.5 L 25.7 35.8 C 22.7 36.4 22 34.5 22 34.5 C 21.5 33.3 20.8 33 20.8 33 C 19.8 32.3 20.9 32.3 20.9 32.3 C 22 32.4 22.6 33.5 22.6 33.5 C 23.6 35.1 25.2 34.7 25.8 34.4 C 25.9 33.7 26.2 33.2 26.5 32.9 C 24 32.6 21.4 31.6 21.4 27.2 C 21.4 26 21.8 25 22.5 24.2 C 22.4 23.9 22 22.7 22.6 21.1 C 22.6 21.1 23.6 20.8 25.8 22.3 C 26.7 22 27.7 21.9 28.7 21.9 C 29.7 21.9 30.7 22 31.6 22.3 C 33.8 20.8 34.8 21.1 34.8 21.1 C 35.4 22.7 35 23.9 34.9 24.2 C 35.6 25 36 26 36 27.2 C 36 31.6 33.4 32.6 30.9 32.9 C 31.3 33.2 31.7 33.9 31.7 35 L 31.7 37.5 C 31.7 37.8 31.9 38 32.4 37.9 C 36.9 36.4 40.4 32.3 40.4 27.5 C 40.4 21.7 35.7 17 28.7 17 Z" fill="#FFFFFF"/>
      <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Open-Source Repository</text>
      <text x="50" y="40" font-family="monospace" font-size="9.5" fill="#4F46E5">maheswari9080/Datheon_Vibe_Coding...</text>
      <rect x="50" y="50" width="160" height="24" rx="6" fill="#4F46E5"/>
      <text x="130" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">View Project on GitHub ➔</text>
    </g>
  </g>
