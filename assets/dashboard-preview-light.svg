          <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Behind the Build: Next.js 15 + React 19 Stack</text>
          <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Architecture lessons learned building full-stack</text>
          <text x="320" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0369A1">Vibe Coding</text>
          <rect x="500" y="15" width="50" height="20" rx="10" fill="#FEE2E2"/>
          <text x="525" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">Blog</text>
          <rect x="620" y="15" width="60" height="20" rx="10" fill="#DCFCE7"/>
          <text x="650" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">Published</text>
