    <!-- App Top Bar -->
    <rect width="1120" height="52" rx="16" fill="#F8FAFC"/>
    <rect y="51" width="1120" height="1" fill="#E2E8F0"/>
    <!-- Window Controls -->
    <circle cx="28" cy="26" r="6" fill="#EF4444"/>
    <circle cx="48" cy="26" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="26" r="6" fill="#10B981"/>

    <!-- App Search Bar -->
