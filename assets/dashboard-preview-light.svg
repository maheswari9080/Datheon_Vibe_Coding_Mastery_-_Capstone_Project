          <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#4338CA">⚡ LIVE AI STUDIO ASSISTANT</text>
          <text x="18" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#1E293B">Prompt: "Write a high-converting hook about our new Supabase Row-Level Security architecture for freelance developers."</text>
          <text x="18" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#4F46E5">Response: "Your client's data should never be one rogue WHERE clause away from disaster. Here is how we enforce DB isolation..."</text>
          <rect x="680" y="28" width="110" height="32" rx="6" fill="#4F46E5"/>
          <text x="735" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Save to Planner</text>
