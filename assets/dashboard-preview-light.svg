        <text x="24" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#4F46E5">📊  Dashboard Overview</text>

        <!-- Campaigns -->
