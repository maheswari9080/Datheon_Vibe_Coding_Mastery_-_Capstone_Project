<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366F1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Canvas Base -->
  <rect width="1100" height="620" rx="16" fill="url(#archBg)" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(50, 40)">
    <rect width="190" height="28" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="95" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="middle">SYSTEM ARCHITECTURE</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0F172A">CreatorFlow AI Full-Stack Architecture</text>
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748B">Modular layers engineered for low-latency delivery, strict RLS isolation, and explainable AI</text>
  </g>

  <!-- 3 MAJOR HORIZONTAL/VERTICAL TIERS -->

  <!-- TIER 1: CLIENT PRESENTATION LAYER -->
  <g transform="translate(50, 150)" filter="url(#cardShadow)">
    <rect width="300" height="420" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="300" height="44" rx="14" fill="#F8FAFC"/>
    <rect y="43" width="300" height="1" fill="#E2E8F0"/>
    <circle cx="20" cy="22" r="6" fill="#3B82F6"/>
    <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Client Presentation Layer</text>

    <!-- Component 1: Next.js 15 App Router -->
    <g transform="translate(18, 62)">
      <rect width="264" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Next.js 15 App Router</text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">React 19 Server &amp; Client Components</text>
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#2563EB">Fast SSR &amp; Streaming Hydration</text>
    </g>

    <!-- Component 2: Public Landing & Sandbox -->
    <g transform="translate(18, 138)">
      <rect width="264" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Public Pages &amp; Sandbox</text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Interactive Prompt Sandbox (No-Auth)</text>
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#059669">Lead Capture &amp; WCAG Contrast</text>
    </g>

    <!-- Component 3: Protected Dashboard App -->
    <g transform="translate(18, 214)">
      <rect width="264" height="84" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#4338CA">Protected Dashboard Workspace</text>
      <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">• Strategic Campaign Hub</text>
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">• AI Studio with Explainable Output</text>
      <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569">• Status Kanban &amp; Action Checklist</text>
    </g>

    <!-- Component 4: State & Theme -->
    <g transform="translate(18, 310)">
      <rect width="264" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Auth Context &amp; Theme Provider</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Persistent light/dark mode • Zero flash</text>
    </g>

    <text x="150" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">Responsive Viewports: 360px – 1440px</text>
  </g>

  <!-- TIER 2: SERVER ACTION & SECURE API LAYER -->
  <g transform="translate(400, 150)" filter="url(#cardShadow)">
    <rect width="300" height="420" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="300" height="44" rx="14" fill="#F8FAFC"/>
    <rect y="43" width="300" height="1" fill="#E2E8F0"/>
    <circle cx="20" cy="22" r="6" fill="#8B5CF6"/>
    <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Server API &amp; AI Security Layer</text>

    <!-- Component 1: Server Actions & REST Routes -->
    <g transform="translate(18, 62)">
      <rect width="264" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">/api/ai/generate [Server Action]</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Server-side LLM orchestration with</text>
      <text x="14" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7C3AED">Zero API key exposure to browser</text>
    </g>

    <!-- Component 2: Lead Gen & Anti-Abuse -->
    <g transform="translate(18, 148)">
      <rect width="264" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">/api/leads [Public Endpoint]</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Anti-abuse token buckets &amp; sanitization</text>
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0284C7">OWASP ASVS API Hardened</text>
    </g>

    <!-- Component 3: Explainable AI Engine -->
    <g transform="translate(18, 224)">
      <rect width="264" height="88" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6D28D9">Explainable AI (XAI) Synthesis</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#4B5563">• Platform calibrator (X, LI, IG, Blog)</text>
      <text x="14" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#4B5563">• Audience fit scoring (0–100%)</text>
      <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7C3AED">• Transparent reasoning justification</text>
    </g>

    <!-- Component 4: Zod Schema Validation -->
    <g transform="translate(18, 324)">
      <rect width="264" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Runtime Schema Validation</text>
      <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">TypeScript + Zod request contracts</text>
    </g>

    <text x="150" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">OpenAI GPT-4o / Claude / Gemini Ready</text>
  </g>

  <!-- TIER 3: PERSISTENCE & RLS SECURITY LAYER -->
  <g transform="translate(750, 150)" filter="url(#cardShadow)">
    <rect width="300" height="420" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="300" height="44" rx="14" fill="#F8FAFC"/>
    <rect y="43" width="300" height="1" fill="#E2E8F0"/>
    <circle cx="20" cy="22" r="6" fill="#10B981"/>
    <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Supabase PostgreSQL &amp; RLS</text>

    <!-- RLS Policy Banner -->
    <g transform="translate(18, 62)">
      <rect width="264" height="58" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#065F46">🛡️ Strict Row-Level Security (RLS)</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#047857">auth.uid() = user_id enforcement</text>
      <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#059669">Guarantees zero cross-tenant leakage</text>
    </g>

    <!-- Schema Tables -->
    <g transform="translate(18, 132)">
      <rect width="264" height="236" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Relational Schema Tables</text>

      <!-- Table 1: profiles -->
      <g transform="translate(12, 34)">
        <rect width="240" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#4F46E5">public.profiles</text>
        <text x="10" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">User settings, roles &amp; preferences</text>
      </g>

      <!-- Table 2: campaigns -->
      <g transform="translate(12, 74)">
        <rect width="240" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#4F46E5">public.campaigns</text>
        <text x="10" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Strategic goals, target audience, dates</text>
      </g>

      <!-- Table 3: content_items -->
      <g transform="translate(12, 114)">
        <rect width="240" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#4F46E5">public.content_items</text>
        <text x="10" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Hooks, copy, pipeline status, metrics</text>
      </g>

      <!-- Table 4: campaign_tasks & leads -->
      <g transform="translate(12, 154)">
        <rect width="240" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#4F46E5">public.campaign_tasks</text>
        <text x="10" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Action checklist linked to milestones</text>
      </g>

      <!-- Table 5: leads -->
      <g transform="translate(12, 194)">
        <rect width="240" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="10" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#4F46E5">public.leads</text>
        <text x="10" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Captured early-access leads</text>
      </g>
    </g>

    <text x="150" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">Automated Triggers &amp; RLS Policies</text>
  </g>

  <!-- CONNECTING ARROWS BETWEEN TIERS -->
  <!-- Tier 1 to Tier 2 -->
  <path d="M 350 250 L 400 250" fill="none" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 400 320 L 350 320" fill="none" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Tier 2 to Tier 3 -->
  <path d="M 700 250 L 750 250" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M 750 320 L 700 320" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
</svg>
